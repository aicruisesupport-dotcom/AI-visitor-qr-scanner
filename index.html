      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0">

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:12px;
  font-family:Arial,sans-serif;

</head>


<body>

<div class="container">


<!-- ==================================================
     HEADER
================================================== -->

<div class="header">

  <h1>📷 QR Visitor Scanner</h1>

  <p>
    ระบบสแกน Visitor สำหรับ รปภ.
  </p>

</div>


<!-- ==================================================
     SCANNER
================================================== -->

<div class="card">

  <div class="scan-title">
    📷 สแกน QR Visitor
  </div>


  <div id="reader"></div>


  <div
    id="scanStatus"
    class="scan-status">

    กดปุ่มด้านล่างเพื่อเปิดกล้อง

  </div>


  <button
    id="startScanBtn"
    class="scan-btn"
    onclick="startScanner()">

    📷 เปิดกล้อง

  </button>


  <button
    id="stopScanBtn"
    class="stop-btn hidden"
    onclick="stopScanner()">

    ⏹ ปิดกล้อง

  </button>


  <div
    id="successBox"
    class="success">
  </div>


  <div
    id="errorBox"
    class="error">
  </div>


</div>


<!-- ==================================================
     RESULT
================================================== -->

<div
  id="resultCard"
  class="card hidden">

  <div style="
    text-align:center;
    font-size:18px;
    font-weight:bold;
  ">

    Visitor Code

  </div>


  <div
    id="resultCode"
    class="code">
    -
  </div>


  <button
    class="scan-btn"
    onclick="sendBackToSecurity()">

    ✅ กลับหน้า รปภ.

  </button>


  <button
    class="back-btn"
    onclick="scanAgain()">

    📷 สแกนใหม่

  </button>

</div>


<div class="hint">

  เมื่อสแกนสำเร็จ ระบบจะส่ง Visitor Code
  กลับไปยังหน้า รปภ. โดยอัตโนมัติ

</div>


</div>


<script>

/* ======================================================
GLOBAL
====================================================== */

let html5QrCode = null;

let scannerRunning = false;

let qrProcessing = false;

let scannedCode = "";


/* ======================================================
START SCANNER
====================================================== */

async function startScanner(){

  if(scannerRunning){
    return;
  }


  hideMessages();


  const status =
    document.getElementById("scanStatus");


  status.innerText =
    "กำลังขออนุญาตใช้กล้อง...";


  try{


    /* -----------------------------------------------
       ตรวจสอบ Browser
    ------------------------------------------------ */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "CAMERA_NOT_SUPPORTED"
      );

    }


    /* -----------------------------------------------
       ขอ Permission กล้อง
    ------------------------------------------------ */

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });


    /* -----------------------------------------------
       ได้ Permission แล้ว
       ปิด stream ทดสอบ
    ------------------------------------------------ */

    stream
      .getTracks()
      .forEach(function(track){

        track.stop();

      });


    status.innerText =
      "กำลังเตรียมกล้อง...";


    /* -----------------------------------------------
       ล้าง Scanner เก่า
    ------------------------------------------------ */

    if(html5QrCode){

      try{
        await html5QrCode.stop();
      }catch(e){}

      try{
        html5QrCode.clear();
      }catch(e){}

      html5QrCode = null;

    }


    /* -----------------------------------------------
       สร้าง Scanner
    ------------------------------------------------ */

    html5QrCode =
      new Html5Qrcode("reader");


    /* -----------------------------------------------
       หารายการกล้อง
    ------------------------------------------------ */

    const cameras =
      await Html5Qrcode.getCameras();


    if(
      !cameras ||
      cameras.length === 0
    ){

      throw new Error(
        "NO_CAMERA"
      );

    }


    /* -----------------------------------------------
       เลือกกล้อง
    ------------------------------------------------ */

    let cameraId =
      cameras[0].id;


    for(
      const camera of cameras
    ){

      const label =
        String(
          camera.label || ""
        ).toLowerCase();


      if(
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment") ||
        label.includes("หลัง")
      ){

        cameraId =
          camera.id;

        break;

      }

    }


    /* -----------------------------------------------
       Scanner Config
    ------------------------------------------------ */

    const config = {

      fps:10,

      qrbox:function(
        width,
        height
      ){

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.70
          );


        return{

          width:size,

          height:size

        };

      },

      aspectRatio:1.0,

      disableFlip:false

    };


    /* -----------------------------------------------
       เปิดกล้อง
    ------------------------------------------------ */

    await html5QrCode.start(

      cameraId,

      config,

      onQrScanned,

      function(errorMessage){

        /*
         * ไม่ต้องแสดง error ทุก frame
         */

      }

    );


    /* -----------------------------------------------
       สำเร็จ
    ------------------------------------------------ */

    scannerRunning = true;

    qrProcessing = false;


    status.innerText =
      "📷 กำลังสแกน QR...\n\n" +
      "นำ QR Visitor ให้อยู่ในกรอบ";


    document
      .getElementById(
        "startScanBtn"
      )
      .classList.add("hidden");


    document
      .getElementById(
        "stopScanBtn"
      )
      .classList.remove("hidden");


  }

  catch(error){

    console.error(
      "Camera error:",
      error
    );


    scannerRunning = false;


    /* -----------------------------------------------
       Cleanup
    ------------------------------------------------ */

    if(html5QrCode){

      try{
        await html5QrCode.stop();
      }catch(e){}

      try{
        html5QrCode.clear();
      }catch(e){}

      html5QrCode = null;

    }


    document
      .getElementById(
        "startScanBtn"
      )
      .classList.remove("hidden");


    document
      .getElementById(
        "stopScanBtn"
      )
      .classList.add("hidden");


    let message =
      "❌ ไม่สามารถเปิดกล้องได้";


    if(
      error &&
      (
        error.name ===
        "NotAllowedError" ||

        error.name ===
        "PermissionDeniedError"
      )
    ){

      message =
        "❌ ไม่ได้รับอนุญาตให้ใช้กล้อง\n\n" +
        "กรุณาอนุญาต Camera ใน Browser";

    }


    else if(
      error &&
      (
        error.name ===
        "NotFoundError" ||

        error.message ===
        "NO_CAMERA"
      )
    ){

      message =
        "❌ ไม่พบกล้องในอุปกรณ์นี้";

    }


    else if(
      error &&
      error.name ===
      "NotReadableError"
    ){

      message =
        "❌ กล้องกำลังถูกใช้งานโดยแอปอื่น";

    }


    else if(
      error &&
      error.name ===
      "SecurityError"
    ){

      message =
        "❌ Browser ไม่อนุญาตให้เว็บไซต์ใช้กล้อง\n\n" +
        "กรุณาตรวจสอบ HTTPS";

    }


    showError(message);


    status.innerText =
      "ไม่สามารถเปิดกล้องได้";

  }

}


/* ======================================================
QR SCANNED
====================================================== */

async function onQrScanned(
  decodedText
){

  if(qrProcessing){
    return;
  }


  qrProcessing = true;


  /* -----------------------------------------------
     อ่าน Code
  ------------------------------------------------ */

  const code =
    String(
      decodedText || ""
    )
    .trim()
    .toUpperCase();


  if(!code){

    qrProcessing = false;

    return;

  }


  console.log(
    "QR SCANNED:",
    code
  );


  scannedCode =
    code;


  /* -----------------------------------------------
     แสดง Code
  ------------------------------------------------ */

  document
    .getElementById(
      "resultCode"
    )
    .innerText =
      code;


  document
    .getElementById(
      "resultCard"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "scanStatus"
    )
    .innerText =
      "✅ สแกนสำเร็จ\n\n" +
      code +
      "\n\nกำลังส่งกลับหน้า รปภ....";


  showSuccess(
    "สแกน QR สำเร็จ\n" +
    code
  );


  /* -----------------------------------------------
     หยุดกล้อง
  ------------------------------------------------ */

  await stopScanner();


  /* -----------------------------------------------
     ส่งกลับอัตโนมัติ
  ------------------------------------------------ */

  setTimeout(
    function(){

      sendBackToSecurity();

    },
    800
  );

}


/* ======================================================
STOP SCANNER
====================================================== */

async function stopScanner(){

  if(html5QrCode){

    try{

      if(scannerRunning){

        await html5QrCode.stop();

      }

    }
    catch(error){

      console.log(
        "Stop scanner:",
        error
      );

    }


    try{

      html5QrCode.clear();

    }
    catch(error){}

  }


  html5QrCode = null;

  scannerRunning = false;


  document
    .getElementById(
      "startScanBtn"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "stopScanBtn"
    )
    .classList.add(
      "hidden"
    );

}


/* ======================================================
SEND BACK TO SECURITY PAGE
====================================================== */

function sendBackToSecurity(){

  if(!scannedCode){

    showError(
      "❌ ยังไม่มี Visitor Code"
    );

    return;

  }


  /* -----------------------------------------------
     อ่าน return URL
  ------------------------------------------------ */

  const params =
    new URLSearchParams(
      window.location.search
    );


  let returnUrl =
    params.get("return");


  if(!returnUrl){

    showError(
      "❌ ไม่พบ URL หน้า รปภ.\n\n" +
      "กรุณากลับไปหน้า รปภ. แล้วกด\n" +
      "📷 สแกน QR Visitor ใหม่"
    );

    return;

  }


  /* -----------------------------------------------
     Decode return URL
  ------------------------------------------------ */

  try{

    returnUrl =
      decodeURIComponent(
        returnUrl
      );

  }
  catch(error){

    console.log(
      "Decode return URL:",
      error
    );

  }


  /* -----------------------------------------------
     สร้าง URL
  ------------------------------------------------ */

  let targetUrl;


  try{

    targetUrl =
      new URL(
        returnUrl
      );

  }
  catch(error){

    showError(
      "❌ URL หน้า รปภ. ไม่ถูกต้อง"
    );

    return;

  }


  /* -----------------------------------------------
     ใส่ Visitor Code
  ------------------------------------------------ */

  targetUrl.searchParams.set(
    "visitorCode",
    scannedCode
  );


  /* -----------------------------------------------
     ส่งกลับ
  ------------------------------------------------ */

  console.log(
    "RETURN URL:",
    targetUrl.toString()
  );


  document
    .getElementById(
      "scanStatus"
    )
    .innerText =
      "✅ สแกนสำเร็จ\n\n" +
      scannedCode +
      "\n\nกำลังกลับหน้า รปภ....";


  setTimeout(
    function(){

      window.location.href =
        targetUrl.toString();

    },
    300
  );

}


/* ======================================================
SCAN AGAIN
====================================================== */

function scanAgain(){

  scannedCode = "";

  qrProcessing = false;


  document
    .getElementById(
      "resultCard"
    )
    .classList.add(
      "hidden"
    );


  hideMessages();


  document
    .getElementById(
      "scanStatus"
    )
    .innerText =
      "กดปุ่มด้านล่างเพื่อเปิดกล้อง";


  startScanner();

}


/* ======================================================
MESSAGES
====================================================== */

function showSuccess(message){

  const box =
    document.getElementById(
      "successBox"
    );


  box.innerText =
    message;


  box.style.display =
    "block";


  document
    .getElementById(
      "errorBox"
    )
    .style.display =
      "none";

}


function showError(message){

  const box =
    document.getElementById(
      "errorBox"
    );


  box.innerText =
    message;


  box.style.display =
    "block";


  document
    .getElementById(
      "successBox"
    )
    .style.display =
      "none";

}


function hideMessages(){

  document
    .getElementById(
      "errorBox"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "successBox"
    )
    .style.display =
      "none";

}


/* ======================================================
PAGE EXIT
====================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    if(
      html5QrCode &&
      scannerRunning
    ){

      try{

        html5QrCode.stop();

      }
      catch(error){}

    }

  }
);

</script>

</body>
</html>
```
