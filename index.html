<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>สแกน QR Visitor</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:15px;
  font-family:Arial,sans-serif;
  background:#eef2f5;
}

.container{
  max-width:520px;
  margin:auto;
}

.header{
  background:#172b4d;
  color:#fff;
  padding:20px;
  border-radius:18px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:26px;
}

.header div{
  margin-top:7px;
}

.card{
  background:#fff;
  margin-top:12px;
  padding:18px;
  border-radius:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:15px;
  background:#111;
  min-height:100px;
}

#reader video{
  width:100%!important;
  height:auto!important;
  object-fit:cover;
  border-radius:15px;
}

.status{
  text-align:center;
  padding:15px;
  font-size:17px;
  white-space:pre-line;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:17px;
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
  color:#fff;
  background:#0b57d0;
}

.stop{
  background:#555;
}

.code{
  margin-top:12px;
  padding:14px;
  background:#e8f5e9;
  color:#1b5e20;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  word-break:break-all;
}

.error{
  display:none;
  margin-top:12px;
  padding:13px;
  border-radius:12px;
  background:#ffebee;
  color:#c62828;
  text-align:center;
  white-space:pre-line;
}

.hidden{
  display:none!important;
}

.info{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#e3f2fd;
  color:#0d47a1;
  text-align:center;
  font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>📷 สแกน QR Visitor</h1>

<div>
ระบบ รปภ. Cruise Terminal
</div>

</div>


<div class="card">

<div id="reader"></div>


<div
id="scanStatus"
class="status">

กดปุ่มด้านล่างเพื่อเปิดกล้อง

</div>


<button
id="startBtn"
onclick="startScanner()">

📷 เปิดกล้อง

</button>


<button
id="stopBtn"
class="stop hidden"
onclick="stopScanner()">

⏹ ปิดกล้อง

</button>


<div
id="codeBox"
class="code hidden">
</div>


<div
id="errorBox"
class="error">
</div>


<div class="info">

กรุณาอนุญาตการใช้กล้องเมื่อ Browser ถาม

</div>

</div>

</div>


<script>

/* =====================================================
ตัวแปร
===================================================== */

let scanner = null;

let running = false;

let processing = false;


/* =====================================================
อ่าน URL กลับหน้ารปภ.
===================================================== */

function getReturnUrl(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("return") ||
    params.get("returnUrl") ||
    ""
  );

}


/* =====================================================
เปิด Scanner
===================================================== */

async function startScanner(){

  if(running){

    return;

  }


  hideError();

  processing = false;


  const status =
    document.getElementById(
      "scanStatus"
    );


  status.innerText =
    "กำลังเปิดกล้อง...\n\n" +
    "กรุณากด Allow / อนุญาต หาก Browser ถาม";


  try{

    /*
      สำคัญ:
      ไม่เรียก getUserMedia() เอง

      ให้ html5-qrcode จัดการกล้อง
    */

    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
      เริ่มจากกล้อง environment
      โดยไม่ต้องหา cameraId ก่อน
    */

    await scanner.start(

      {
        facingMode:
          {
            ideal:
              "environment"
          }
      },

      {
        fps:10,

        qrbox:function(
          width,
          height
        ){

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );

          return{
            width:size,
            height:size
          };

        },

        aspectRatio:1.0,

        disableFlip:false

      },

      onScanSuccess,

      function(errorMessage){

        /*
          ไม่แสดง error
          ขณะกำลังค้นหา QR
        */

      }

    );


    running = true;


    status.innerText =
      "📷 กำลังสแกน...\n\n" +
      "นำ QR Visitor มาไว้ในกรอบ";


    document
      .getElementById(
        "startBtn"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "stopBtn"
      )
      .classList
      .remove("hidden");


  }
  catch(error){

    console.error(
      "Camera error:",
      error
    );


    running = false;


    if(scanner){

      try{

        await scanner.stop();

      }
      catch(e){}


      try{

        scanner.clear();

      }
      catch(e){}

    }


    scanner = null;


    document
      .getElementById(
        "startBtn"
      )
      .classList
      .remove("hidden");


    document
      .getElementById(
        "stopBtn"
      )
      .classList
      .add("hidden");


    status.innerText =
      "ไม่สามารถเปิดกล้องได้";


    showError(
      getCameraError(error)
    );

  }

}


/* =====================================================
สแกนสำเร็จ
===================================================== */

async function onScanSuccess(
  decodedText
){

  if(processing){

    return;

  }


  processing = true;


  const code =
    String(
      decodedText || ""
    )
    .trim();


  if(!code){

    processing = false;

    return;

  }


  await stopScanner();


  document
    .getElementById(
      "scanStatus"
    )
    .innerText =
      "✅ สแกนสำเร็จ";


  document
    .getElementById(
      "codeBox"
    )
    .innerText =
      "Visitor Code: " +
      code;


  document
    .getElementById(
      "codeBox"
    )
    .classList
    .remove("hidden");


  const returnUrl =
    getReturnUrl();


  /*
    ถ้าไม่มี URL กลับ
  */

  if(!returnUrl){

    showError(
      "ไม่พบลิงก์กลับหน้าระบบ รปภ.\n\n" +
      "กรุณาเปิด Scanner จากปุ่ม\n" +
      "📷 เปิดกล้องสแกน QR Visitor\n" +
      "ในหน้าระบบ รปภ."
    );


    processing = false;

    return;

  }


  /*
    สร้าง URL กลับ
  */

  const separator =
    returnUrl.includes("?")
      ? "&"
      : "?";


  const finalUrl =
    returnUrl +
    separator +
    "visitorCode=" +
    encodeURIComponent(
      code
    );


  document
    .getElementById(
      "scanStatus"
    )
    .innerText =
      "✅ สแกนสำเร็จ\n\n" +
      "กำลังกลับหน้าระบบ รปภ....";


  setTimeout(
    function(){

      window.location.href =
        finalUrl;

    },
    700
  );

}


/* =====================================================
ปิด Scanner
===================================================== */

async function stopScanner(){

  if(scanner){

    try{

      if(running){

        await scanner.stop();

      }

    }
    catch(error){

      console.log(
        error
      );

    }


    try{

      scanner.clear();

    }
    catch(error){}

  }


  scanner = null;

  running = false;


  document
    .getElementById(
      "startBtn"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "stopBtn"
    )
    .classList
    .add("hidden");

}


/* =====================================================
แสดง Error
===================================================== */

function showError(message){

  const box =
    document.getElementById(
      "errorBox"
    );


  box.innerText =
    message;


  box.style.display =
    "block";

}


function hideError(){

  const box =
    document.getElementById(
      "errorBox"
    );


  box.style.display =
    "none";

}


/* =====================================================
Camera Error
===================================================== */

function getCameraError(error){

  if(
    error &&
    (
      error.name ===
        "NotAllowedError" ||

      error.name ===
        "PermissionDeniedError"
    )
  ){

    return(
      "❌ Browser ไม่อนุญาตให้ใช้กล้อง\n\n" +

      "ให้ตรวจสอบ Permission ของเว็บไซต์\n" +

      "แล้วตั้ง Camera = Allow\n\n" +

      "จากนั้นปิดหน้า Scanner แล้วเปิดใหม่"
    );

  }


  if(
    error &&
    (
      error.name ===
        "NotFoundError" ||

      error.name ===
        "DevicesNotFoundError"
    )
  ){

    return(
      "❌ ไม่พบกล้องในอุปกรณ์"
    );

  }


  if(
    error &&
    (
      error.name ===
        "NotReadableError" ||

      error.name ===
        "TrackStartError"
    )
  ){

    return(
      "❌ ไม่สามารถเข้าถึงกล้องได้\n\n" +

      "กล้องอาจกำลังถูกใช้งานโดยแอปอื่น\n" +

      "กรุณาปิดแอปกล้องหรือ Browser อื่น"
    );

  }


  if(
    error &&
    error.name ===
      "OverconstrainedError"
  ){

    return(
      "❌ กล้องไม่รองรับการตั้งค่าที่ร้องขอ"
    );

  }


  return(
    "❌ ไม่สามารถเปิดกล้องได้\n\n" +

    (
      error &&
      error.message
        ? error.message
        : "กรุณาตรวจสอบสิทธิ์ Camera ของเว็บไซต์"
    )
  );

}


/* =====================================================
ปิดกล้องเมื่อออกจากหน้า
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    if(
      scanner &&
      running
    ){

      try{

        scanner.stop();

      }
      catch(e){}

    }

  }
);

</script>

</body>

</html>
