<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>สแกน QR Visitor</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:16px;
  font-family:Arial,sans-serif;
  background:#eef2f5;
}

.container{
  max-width:520px;
  margin:auto;
}

.header{
  background:#172b4d;
  color:white;
  padding:20px;
  border-radius:18px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:26px;
}

.header p{
  margin:7px 0 0;
  opacity:.85;
}

.card{
  background:white;
  padding:18px;
  margin-top:14px;
  border-radius:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:14px;
  background:#111;
}

#reader video{
  width:100%!important;
  height:auto!important;
  object-fit:cover;
}

.status{
  text-align:center;
  margin:15px 0;
  white-space:pre-line;
  font-weight:bold;
  color:#555;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:17px;
  margin-top:10px;
  font-size:19px;
  font-weight:bold;
  color:white;
}

.start{
  background:#0b57d0;
}

.stop{
  background:#555;
}

.back{
  background:#16803c;
}

.success{
  display:none;
  text-align:center;
  background:#e8f5e9;
  color:#1b5e20;
  padding:16px;
  border-radius:13px;
  margin-top:14px;
  font-weight:bold;
  white-space:pre-line;
}

.error{
  display:none;
  text-align:center;
  background:#ffebee;
  color:#c62828;
  padding:16px;
  border-radius:13px;
  margin-top:14px;
  white-space:pre-line;
}

.hidden{
  display:none!important;
}
</style>

</head>

<body>

<div class="container">

  <div class="header">
    <h1>📷 สแกน QR Visitor</h1>
    <p>ระบบ รปภ. - Cruise Terminal</p>
  </div>

  <div class="card">

```
<div id="reader"></div>

<div id="status" class="status">
  กดปุ่มเพื่อเปิดกล้อง
</div>

<button
  id="startBtn"
  class="start"
  onclick="startScanner()">
  📷 เปิดกล้อง
</button>

<button
  id="stopBtn"
  class="stop hidden"
  onclick="stopScanner()">
  ⏹ ปิดกล้อง
</button>

<div id="success" class="success"></div>

<div id="error" class="error"></div>

<button
  id="backBtn"
  class="back hidden"
  onclick="returnToSecurity()">
  ↩️ กลับหน้าระบบ รปภ.
</button>
```

  </div>

</div>

<script>

let scanner = null;
let running = false;
let scanned = false;

function getReturnUrl(){

  const params = new URLSearchParams(
    window.location.search
  );

  return params.get("return") || "";

}


/* =========================
   START CAMERA
========================= */

async function startScanner(){

  if(running) return;

  scanned = false;

  hideMessages();

  document.getElementById("status").innerText =
    "กำลังเปิดกล้อง...";

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error("CAMERA_NOT_SUPPORTED");

    }

    /*
      ขอสิทธิ์กล้องก่อน
    */

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{
            ideal:"environment"
          }
        },
        audio:false
      });

    stream.getTracks().forEach(
      track => track.stop()
    );


    /*
      สร้าง QR Scanner
    */

    if(scanner){

      try{
        await scanner.stop();
      }catch(e){}

      try{
        scanner.clear();
      }catch(e){}

    }

    scanner =
      new Html5Qrcode("reader");


    const cameras =
      await Html5Qrcode.getCameras();


    if(!cameras || cameras.length === 0){

      throw new Error("NO_CAMERA");

    }


    /*
      เลือกกล้องหลัง
    */

    let cameraId =
      cameras[0].id;

    for(const camera of cameras){

      const label =
        String(camera.label || "")
        .toLowerCase();

      if(
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment") ||
        label.includes("หลัง")
      ){

        cameraId = camera.id;
        break;

      }

    }


    const config = {

      fps:10,

      qrbox:function(width,height){

        const size =
          Math.floor(
            Math.min(width,height) * 0.70
          );

        return{
          width:size,
          height:size
        };

      },

      aspectRatio:1.0,

      disableFlip:false

    };


    await scanner.start(

      cameraId,

      config,

      onScanSuccess,

      function(errorMessage){}

    );


    running = true;

    document
      .getElementById("startBtn")
      .classList.add("hidden");

    document
      .getElementById("stopBtn")
      .classList.remove("hidden");

    document
      .getElementById("status")
      .innerText =
        "📷 กำลังสแกน...\n\n"+
        "นำ QR Visitor ให้อยู่ในกรอบ";

  }

  catch(error){

    console.error(error);

    running = false;

    let message =
      "❌ ไม่สามารถเปิดกล้องได้";

    if(
      error.name === "NotAllowedError" ||
      error.name === "PermissionDeniedError"
    ){

      message =
        "❌ ไม่ได้รับอนุญาตให้ใช้กล้อง\n\n"+
        "กรุณาอนุญาต Camera แล้วลองใหม่";

    }

    else if(
      error.name === "NotFoundError" ||
      error.message === "NO_CAMERA"
    ){

      message =
        "❌ ไม่พบกล้อง";

    }

    else if(
      error.name === "NotReadableError"
    ){

      message =
        "❌ กล้องกำลังถูกใช้งานโดยแอปอื่น";

    }

    showError(message);

    document
      .getElementById("status")
      .innerText =
        "เปิดกล้องไม่สำเร็จ";

  }

}


/* =========================
   SCAN SUCCESS
========================= */

async function onScanSuccess(decodedText){

  if(scanned) return;

  scanned = true;

  const value =
    String(decodedText || "")
      .trim();

  if(!value){

    scanned = false;
    return;

  }


  /*
    รองรับ QR ที่เป็น Visitor Code โดยตรง
    เช่น CR-260915-0001
  */

  let visitorCode = value;


  /*
    ถ้า QR เป็น URL ที่มี visitorCode
    ให้ดึง visitorCode ออกมา
  */

  try{

    if(
      value.startsWith("http://") ||
      value.startsWith("https://")
    ){

      const url =
        new URL(value);

      const qrCode =
        url.searchParams.get("visitorCode");

      if(qrCode){

        visitorCode =
          decodeURIComponent(qrCode)
          .trim();

      }

    }

  }catch(e){

    console.log(e);

  }


  document
    .getElementById("status")
    .innerText =
      "✅ สแกนสำเร็จ";

  document
    .getElementById("success")
    .innerText =
      "Visitor Code\n"+
      visitorCode;

  document
    .getElementById("success")
    .style.display =
      "block";


  await stopScanner();


  /*
    ส่งกลับหน้า รปภ.
  */

  const returnUrl =
    getReturnUrl();


  if(!returnUrl){

    showError(
      "ไม่พบลิงก์หน้าระบบ รปภ.\n\n"+
      "กรุณาเปิด Scanner จากปุ่มในหน้าระบบ รปภ."
    );

    document
      .getElementById("backBtn")
      .classList.remove("hidden");

    return;

  }


  /*
    เพิ่ม visitorCode กลับไปใน URL
  */

  const separator =
    returnUrl.includes("?")
      ? "&"
      : "?";

  const target =
    returnUrl +
    separator +
    "visitorCode=" +
    encodeURIComponent(visitorCode);


  /*
    หน่วงเล็กน้อยให้เห็นว่าสแกนสำเร็จ
  */

  setTimeout(function(){

    window.location.href =
      target;

  },700);

}


/* =========================
   STOP
========================= */

async function stopScanner(){

  if(scanner){

    try{

      if(running){

        await scanner.stop();

      }

    }catch(e){

      console.log(e);

    }

    try{

      scanner.clear();

    }catch(e){}

  }

  scanner = null;
  running = false;

  document
    .getElementById("startBtn")
    .classList.remove("hidden");

  document
    .getElementById("stopBtn")
    .classList.add("hidden");

}


/* =========================
   RETURN
========================= */

function returnToSecurity(){

  const url =
    getReturnUrl();

  if(url){

    window.location.href = url;

  }

}


/* =========================
   MESSAGE
========================= */

function hideMessages(){

  document
    .getElementById("success")
    .style.display="none";

  document
    .getElementById("error")
    .style.display="none";

}


function showError(message){

  const box =
    document.getElementById("error");

  box.innerText =
    message;

  box.style.display =
    "block";

}


/* =========================
   PAGE EXIT
========================= */

window.addEventListener(
  "beforeunload",
  function(){

    if(scanner && running){

      try{
        scanner.stop();
      }catch(e){}

    }

  }
);

</script>

</body>
</html>
