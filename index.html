<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ทดสอบกล้อง</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#eef2f5;
  font-family:Arial,sans-serif;
}

.box{
  max-width:520px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.1);
}

h1{
  text-align:center;
}

video{
  width:100%;
  background:#000;
  border-radius:15px;
  margin-top:15px;
}

button{
  width:100%;
  padding:17px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:#0b57d0;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.status{
  margin-top:15px;
  padding:15px;
  background:#f5f5f5;
  border-radius:12px;
  white-space:pre-line;
}

.success{
  background:#e8f5e9;
  color:#1b5e20;
}

.error{
  background:#ffebee;
  color:#c62828;
}
</style>
</head>

<body>

<div class="box">

<h1>📷 ทดสอบกล้อง</h1>

<div id="status" class="status">
กดปุ่มเพื่อทดสอบกล้อง
</div>

<video
id="video"
autoplay
playsinline
muted>
</video>

<button onclick="testCamera()">
📷 เปิดกล้องทดสอบ
</button>

<button
onclick="stopCamera()"
style="background:#555">
⏹ ปิดกล้อง
</button>

</div>

<script>

let stream = null;

async function testCamera(){

  const status =
    document.getElementById("status");

  status.className = "status";

  status.innerText =
    "กำลังขอสิทธิ์ใช้กล้อง...";

  try{

    /* ตรวจ HTTPS */

    if(
      location.protocol !== "https:" &&
      location.hostname !== "localhost"
    ){

      throw new Error(
        "หน้านี้ไม่ได้เปิดผ่าน HTTPS"
      );

    }


    /* ตรวจ Camera API */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Browser ไม่มี Camera API"
      );

    }


    /* ขอใช้กล้อง */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });


    /* แสดงภาพ */

    const video =
      document.getElementById("video");

    video.srcObject =
      stream;


    await video.play();


    status.className =
      "status success";

    status.innerText =
      "✅ เปิดกล้องสำเร็จ\n\n"+
      "ถ้าคุณเห็นภาพจากกล้องด้านบน "+
      "แสดงว่ากล้องใช้งานได้";

  }

  catch(error){

    console.error(
      "CAMERA ERROR:",
      error
    );


    status.className =
      "status error";


    let message =
      "❌ เปิดกล้องไม่สำเร็จ\n\n";


    message +=
      "Error: " +
      (error.name || "Unknown") +
      "\n\n";


    message +=
      "รายละเอียด: " +
      (error.message || "ไม่ทราบสาเหตุ");


    if(
      error.name ===
      "NotAllowedError"
    ){

      message +=
        "\n\n"+
        "สาเหตุที่เป็นไปได้:\n"+
        "• ยังไม่ได้อนุญาต Camera\n"+
        "• Browser บล็อก Camera\n"+
        "• เว็บไซต์ถูกตั้งค่าไม่ให้ใช้ Camera\n\n"+
        "ให้ตรวจสอบสิทธิ์ Camera ของเว็บไซต์นี้";

    }


    if(
      error.name ===
      "NotFoundError"
    ){

      message +=
        "\n\n"+
        "ไม่พบกล้องในอุปกรณ์";

    }


    if(
      error.name ===
      "NotReadableError"
    ){

      message +=
        "\n\n"+
        "พบกล้องแต่ไม่สามารถใช้งานได้\n"+
        "อาจมีแอปอื่นกำลังใช้กล้อง";

    }


    status.innerText =
      message;

  }

}


function stopCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(function(track){

        track.stop();

      });

    stream = null;

  }


  document
    .getElementById("video")
    .srcObject = null;


  document
    .getElementById("status")
    .className = "status";


  document
    .getElementById("status")
    .innerText =
      "ปิดกล้องแล้ว";

}

</script>

</body>
</html>
