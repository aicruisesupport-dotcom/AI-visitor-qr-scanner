<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>สแกน QR Visitor</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:15px;
  font-family:Arial,sans-serif;
  background:#eef2f5;
}

.container{
  max-width:520px;
  margin:auto;
}

.header{
  background:#172b4d;
  color:#fff;
  padding:20px;
  border-radius:18px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:26px;
}

.card{
  background:#fff;
  margin-top:12px;
  padding:18px;
  border-radius:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:15px;
  background:#111;
}

#reader video{
  width:100%!important;
  height:auto!important;
  object-fit:cover;
  border-radius:15px;
}

.status{
  text-align:center;
  padding:15px;
  font-size:17px;
  white-space:pre-line;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:17px;
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
  color:#fff;
  background:#0b57d0;
}

.stop{
  background:#555;
}

.code{
  margin-top:12px;
  padding:14px;
  background:#e8f5e9;
  color:#1b5e20;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  word-break:break-all;
}

.error{
  display:none;
  margin-top:12px;
  padding:13px;
  border-radius:12px;
  background:#ffebee;
  color:#c62828;
  text-align:center;
  white-space:pre-line;
}

.hidden{
  display:none!important;
}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>📷 สแกน QR Visitor</h1>

    <div style="margin-top:7px">
      ระบบ รปภ. Cruise Terminal
    </div>

  </div>


  <div class="card">

    <div id="reader"></div>

    <div id="scanStatus" class="status">
      กดปุ่มด้านล่างเพื่อเปิดกล้อง
    </div>


    <button
      id="startBtn"
      onclick="startScanner()">

      📷 เปิดกล้อง

    </button>


    <button
      id="stopBtn"
      class="stop hidden"
      onclick="stopScanner()">

      ⏹ ปิดกล้อง

    </button>


    <div
      id="codeBox"
      class="code hidden">
    </div>


    <div
      id="errorBox"
      class="error">
    </div>

  </div>

</div>


<script>

let scanner = null;
let running = false;
let processing = false;


/* =========================================
อ่านลิงก์กลับหน้ารปภ.
========================================= */

function getReturnUrl(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("return");

}


/* =========================================
เปิดกล้อง
========================================= */

async function startScanner(){

  if(running){
    return;
  }

  hideError();

  document
    .getElementById("codeBox")
    .classList.add("hidden");


  const status =
    document.getElementById("scanStatus");

  status.innerText =
    "กำลังขออนุญาตใช้กล้อง...\n\n"+
    "กรุณากด Allow / อนุญาต หาก Browser ถาม";


  try{

    /*
      สร้าง Scanner ใหม่
    */

    if(scanner){

      try{
        await scanner.clear();
      }catch(e){}

      scanner=null;

    }


    scanner =
      new Html5Qrcode("reader");


    /*
      ใช้กล้องหลังโดยตรง

      ไม่เรียก getUserMedia()
      ก่อนหน้านี้แล้ว
    */

    await scanner.start(

      {
        facingMode:"environment"
      },

      {
        fps:10,

        qrbox:function(width,height){

          const size =
            Math.floor(
              Math.min(width,height)*0.70
            );

          return{
            width:size,
            height:size
          };

        },

        aspectRatio:1.0,

        disableFlip:false

      },

      onScanSuccess,

      function(errorMessage){

        /*
          ไม่ต้องแสดง error
          ระหว่างค้นหา QR
        */

      }

    );


    running=true;
    processing=false;


    status.innerText =
      "📷 กำลังสแกน...\n\n"+
      "นำ QR Visitor มาไว้ในกรอบ";


    document
      .getElementById("startBtn")
      .classList.add("hidden");


    document
      .getElementById("stopBtn")
      .classList.remove("hidden");


  }
  catch(error){

    console.error(
      "Camera error:",
      error
    );


    running=false;


    if(scanner){

      try{

        if(
          scanner.getState &&
          scanner.getState() !== 1
        ){
          /*
            ปล่อยให้ clear ด้านล่างจัดการ
          */
        }

      }catch(e){}


      try{
        scanner.clear();
      }catch(e){}

      scanner=null;

    }


    document
      .getElementById("startBtn")
      .classList.remove("hidden");


    document
      .getElementById("stopBtn")
      .classList.add("hidden");


    status.innerText =
      "ไม่สามารถเปิดกล้องได้";


    showError(
      getCameraError(error)
    );

  }

}


/* =========================================
สแกนสำเร็จ
========================================= */

async function onScanSuccess(decodedText){

  if(processing){
    return;
  }

  processing=true;


  const code =
    String(decodedText || "")
      .trim()
      .toUpperCase();


  if(!code){

    processing=false;

    return;

  }


  await stopScanner();


  document
    .getElementById("scanStatus")
    .innerText =
      "✅ สแกนสำเร็จ";


  document
    .getElementById("codeBox")
    .innerText =
      "Visitor Code: " + code;


  document
    .getElementById("codeBox")
    .classList
    .remove("hidden");


  /*
    เอาลิงก์กลับจาก URL
  */

  const returnUrl =
    getReturnUrl();


  if(!returnUrl){

    showError(
      "❌ ไม่พบลิงก์กลับหน้าของ รปภ.\n\n"+
      "กรุณาเปิด Scanner จากปุ่ม\n"+
      "📷 เปิดกล้องสแกน QR Visitor\n"+
      "ในหน้าระบบ รปภ."
    );

    processing=false;

    return;

  }


  /*
    เพิ่ม visitorCode
  */

  const separator =
    returnUrl.includes("?")
    ? "&"
    : "?";


  const finalUrl =
    returnUrl +
    separator +
    "visitorCode=" +
    encodeURIComponent(code);


  document
    .getElementById("scanStatus")
    .innerText =
      "✅ สแกนสำเร็จ\n"+
      "กำลังกลับหน้าระบบ รปภ....";


  setTimeout(function(){

    window.location.href =
      finalUrl;

  },700);

}


/* =========================================
ปิดกล้อง
========================================= */

async function stopScanner(){

  if(scanner){

    try{

      if(running){

        await scanner.stop();

      }

    }
    catch(error){

      console.log(
        "Stop camera:",
        error
      );

    }


    try{

      scanner.clear();

    }
    catch(error){}

  }


  scanner=null;
  running=false;


  document
    .getElementById("startBtn")
    .classList
    .remove("hidden");


  document
    .getElementById("stopBtn")
    .classList
    .add("hidden");

}


/* =========================================
แสดง Error
========================================= */

function showError(message){

  const box =
    document.getElementById(
      "errorBox"
    );

  box.innerText =
    message;

  box.style.display =
    "block";

}


function hideError(){

  document
    .getElementById("errorBox")
    .style.display =
      "none";

}


/* =========================================
Camera Error
========================================= */

function getCameraError(error){

  console.error(
    "Camera error detail:",
    error
  );


  if(
    error &&
    (
      error.name ===
        "NotAllowedError" ||

      error.name ===
        "PermissionDeniedError"
    )
  ){

    return(
      "❌ Browser ไม่อนุญาตให้ใช้กล้อง\n\n"+
      "1. กดไอคอน 🔒 หรือปุ่มตั้งค่าข้าง URL\n"+
      "2. เลือก Camera\n"+
      "3. เลือก Allow / อนุญาต\n"+
      "4. โหลดหน้าใหม่\n\n"+
      "ถ้ายังไม่ได้ ให้ตรวจสอบสิทธิ์ Camera "+
      "ของ Browser ในโทรศัพท์"
    );

  }


  if(
    error &&
    error.name ===
      "NotFoundError"
  ){

    return(
      "❌ ไม่พบกล้องในอุปกรณ์"
    );

  }


  if(
    error &&
    error.name ===
      "NotReadableError"
  ){

    return(
      "❌ กล้องถูกใช้งานโดยแอปอื่น\n\n"+
      "ปิดแอปกล้องหรือแอปที่ใช้กล้องอยู่ "+
      "แล้วลองใหม่"
    );

  }


  if(
    error &&
    error.name ===
      "OverconstrainedError"
  ){

    return(
      "❌ ไม่สามารถเลือกกล้องหลังได้\n\n"+
      "ลองโหลดหน้าใหม่แล้วเปิดกล้องอีกครั้ง"
    );

  }


  if(
    error &&
    error.name ===
      "SecurityError"
  ){

    return(
      "❌ Browser บล็อกการใช้กล้อง\n\n"+
      "กรุณาเปิดหน้าเว็บผ่าน HTTPS"
    );

  }


  if(
    !window.isSecureContext
  ){

    return(
      "❌ หน้าเว็บไม่ใช่ HTTPS\n\n"+
      "กรุณาเปิดผ่านลิงก์ GitHub Pages"
    );

  }


  return(
    "❌ ไม่สามารถเปิดกล้องได้\n\n"+
    "Error: "+
    (
      error &&
      error.message
      ? error.message
      : String(error)
    )
  );

}


/* =========================================
ก่อนออกจากหน้า
========================================= */

window.addEventListener(
  "beforeunload",
  function(){

    if(
      scanner &&
      running
    ){

      try{
        scanner.stop();
      }catch(e){}

    }

  }
);

</script>

</body>
</html>
